<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0d0d18;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;width:230px;padding:16px}
  .logo{display:flex;align-items:center;gap:7px;margin-bottom:3px}
  .star{color:#818cf8;font-size:18px;line-height:1}
  .title{font-size:15px;font-weight:800;color:#fff}
  .sub{font-size:10px;color:#475569;margin-bottom:12px}
  .model-badge{background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.2);border-radius:5px;padding:4px 9px;font-size:10px;font-weight:600;color:#818cf8;margin-bottom:14px;word-break:break-all}
  .btn{display:block;width:100%;padding:9px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#94a3b8;font-size:12px;font-weight:600;cursor:pointer;text-align:left;margin-bottom:8px;font-family:inherit;transition:all .13s}
  .btn:hover{background:rgba(255,255,255,0.1);color:#e2e8f0}
  .btn:active{transform:scale(0.98)}
  .btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-color:transparent}
  .btn-primary:hover{box-shadow:0 3px 14px rgba(99,102,241,0.4)}
  .divider{height:1px;background:rgba(255,255,255,0.06);margin:10px 0}
  .status{font-size:11px;color:#f87171;min-height:16px;margin-top:4px}
</style>
</head>
<body>
<div class="logo"><span class="star">✦</span><span class="title">CoverCraft</span></div>
<div class="sub">for Tirth Shah</div>
<div class="model-badge" id="model-badge">Loading...</div>
<button class="btn btn-primary" id="open-btn">✦ Open Panel on This Page</button>
<div class="status" id="status"></div>
<div class="divider"></div>
<button class="btn" id="dash-btn">📊 Dashboard &amp; Logs</button>
<button class="btn" id="settings-btn">⚙ Settings</button>
<script src="popup.js"></script>
</body>
</html>
