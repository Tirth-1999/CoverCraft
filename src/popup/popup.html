<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#07070d;
    --panel:rgba(15,15,24,.92);
    --panel-soft:rgba(255,255,255,.04);
    --border:rgba(255,255,255,.08);
    --text:#e2e8f0;
    --muted:#94a3b8;
    --faint:#64748b;
    --accent:#818cf8;
    --accent-2:#8b5cf6;
    --shadow:0 22px 70px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    width:340px;
    min-height:100%;
    padding:14px;
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:
      radial-gradient(circle at top left, rgba(99,102,241,.22), transparent 26%),
      radial-gradient(circle at top right, rgba(139,92,246,.16), transparent 20%),
      linear-gradient(180deg,#05050b 0%,#07070d 44%,#05050b 100%);
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.08;
    background-image:
      linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
    background-size:34px 34px;
    mask-image:linear-gradient(180deg, rgba(0,0,0,.4), transparent 92%);
  }
  .shell{display:grid;gap:12px;position:relative;z-index:1}
  .hero{
    padding:12px;
    border-radius:22px;
    background:linear-gradient(180deg, rgba(17,17,29,.98), rgba(12,12,20,.95));
    border:1px solid rgba(255,255,255,.08);
    box-shadow:var(--shadow);
  }
  .brand{display:flex;align-items:center;gap:10px}
  .brand-mark{
    width:30px;
    height:30px;
    border-radius:10px;
    display:grid;
    place-items:center;
    background:rgba(129,140,248,.14);
    border:1px solid rgba(129,140,248,.24);
    color:#c7d2fe;
    font-size:16px;
    flex-shrink:0;
  }
  .brand-copy{min-width:0}
  .title{
    font-family:Syne,Inter,system-ui,sans-serif;
    font-size:18px;
    font-weight:800;
    letter-spacing:-.03em;
    color:#fff;
    line-height:1.05;
  }
  .sub{
    display:none;
  }
  .model-card{
    margin-top:10px;
    padding:9px 11px;
    border-radius:16px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
  }
  .model-label{
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--faint);
    margin-bottom:6px;
  }
  .model-badge{
    color:#dbe4ff;
    font-size:12px;
    line-height:1.5;
    word-break:break-word;
  }
  .account-strip{
    margin-top:8px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-radius:16px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
  }
  .account-avatar{
    width:34px;
    height:34px;
    border-radius:999px;
    overflow:hidden;
    display:grid;
    place-items:center;
    background:rgba(129,140,248,.14);
    border:1px solid rgba(129,140,248,.24);
    color:#dbe4ff;
    font-family:Syne,Inter,system-ui,sans-serif;
    font-size:12px;
    font-weight:800;
    flex-shrink:0;
  }
  .account-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .account-copy{
    min-width:0;
    display:grid;
    gap:2px;
  }
  .account-name{
    font-family:Syne,Inter,system-ui,sans-serif;
    font-size:12px;
    font-weight:800;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .account-sub{
    color:var(--muted);
    font-size:11px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .panel{
    padding:10px;
    border-radius:22px;
    background:var(--panel);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
  }
  .primary-btn,.secondary-btn{
    appearance:none;
    width:100%;
    border:0;
    border-radius:14px;
    padding:12px 14px;
    font-family:Inter,system-ui,sans-serif;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .primary-btn{
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    color:#fff;
    box-shadow:0 14px 30px rgba(99,102,241,.26);
    margin-bottom:8px;
  }
  .secondary-grid{display:grid;gap:8px}
  .secondary-btn{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    color:var(--text);
  }
  .tertiary-link{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.05);
    color:var(--text);
    text-decoration:none;
    padding:11px 14px;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:12px;
    font-weight:800;
    margin-top:8px;
    text-align:center;
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .tertiary-link:hover{
    transform:translateY(-1px);
    background:rgba(255,255,255,.08);
    border-color:rgba(255,255,255,.12);
  }
  .primary-btn:hover,.secondary-btn:hover{transform:translateY(-1px)}
  .btn-label{display:grid;gap:3px}
  .btn-label strong{font-size:12px;letter-spacing:-.01em}
  .btn-arrow{color:#fff;opacity:.9;font-size:13px;flex-shrink:0}
  .status{
    min-height:18px;
    color:#fca5a5;
    font-size:11px;
    line-height:1.4;
    padding:0 2px;
  }
</style>
</head>
<body>
<div class="shell">
  <header class="hero">
    <div class="brand">
      <div class="brand-mark">✦</div>
      <div class="brand-copy">
        <div class="title">CoverCraft</div>
      </div>
    </div>
    <div class="model-card">
      <div class="model-label">Current model</div>
      <div class="model-badge" id="model-badge">Loading...</div>
    </div>
    <div class="account-strip">
      <div class="account-avatar" id="account-avatar">G</div>
      <div class="account-copy">
        <div class="account-name" id="account-name">Guest</div>
        <div class="account-sub" id="account-sub">Not signed in</div>
      </div>
    </div>
  </header>

  <section class="panel">
    <button class="primary-btn" id="open-btn" type="button">
      <span class="btn-label">
        <strong>Open Panel on This Page</strong>
      </span>
    </button>
    <div class="secondary-grid">
      <button class="secondary-btn" id="dash-btn" type="button">
        <span class="btn-label">
          <strong>Dashboard</strong>
        </span>
      </button>
      <button class="secondary-btn" id="settings-btn" type="button">
        <span class="btn-label">
          <strong>Settings / Profile</strong>
        </span>
      </button>
    </div>
    <a class="tertiary-link" id="website-link" href="#">
      <span>Open Website / Guide</span>
      <span class="btn-arrow">↗</span>
    </a>
  </section>

  <div class="status" id="status"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
